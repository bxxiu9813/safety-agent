<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病安通報與諮詢助理</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1a365d;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #4a5568;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .tag {
            display: inline-block;
            background-color: #e2e8f0;
            color: #2d3748;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="tag">臨床風險管理與病人安全</span>
        <h1>病安通報與諮詢助理</h1>
        <p>您好！本系統協助您查詢醫策會（TPR）通報標準、判定事件嚴重度（如跌倒、管路、給藥等通報流程）。</p>
        
        <!-- 提示：未來如果有 Coze 嵌入碼或連結，可以放在這裡 -->
    </div>

</body>
</html>
